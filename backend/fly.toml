app = "reconly"
primary_region = "ord"

[build]
dockerfile = "Dockerfile"

[processes]
app = "sh -c 'alembic upgrade head || true; exec uvicorn app.main:app --host 0.0.0.0 --port 10000'"

[[services]]
protocol = "tcp"
internal_port = 10000
processes = ["app"]

[[services.ports]]
port = 80
handler = "http"
force_https = true

[[services.ports]]
port = 443
handler = "tls"

[checks.status]
port = 10000
type = "http"
interval = "30s"
timeout = "5s"
grace_period = "10s"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"