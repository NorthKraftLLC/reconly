repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: true
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: true
      - id: mypy
        name: mypy
        entry: mypy --config-file backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: true

fail_fast: true
