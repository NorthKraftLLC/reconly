app = "reconly-web"
primary_region = "ord"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[checks.status]
port = 80
type = "http"
interval = "30s"
timeout = "5s"
grace_period = "5s"
path = "/"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"